name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  build-test-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DATOMSIM_WERROR=ON && cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark numbers
        if: always()
        run: ./build/test_physics --gtest_filter='ChainReaction.*' | grep -E "info|OK|FAILED"
      - name: Run U-235 + thermal neutron
        if: always()
        run: mkdir -p csv && ./build/atomsim --csv csv | tee u235.txt
      - name: Monte Carlo thread scaling
        if: always()
        run: |
          nproc
          for t in 1 2 4; do
            ./build/atomsim --events 200000 --threads $t | grep "Monte Carlo:"
          done
      - name: Run U-238 thermal (no fission) and fast
        if: always()
        run: |
          ./build/atomsim --target U238 | tail -12
          ./build/atomsim --target U238 --energy 2 --events 20000 | tee u238-fast.txt | tail -60
      - name: Run Pu-239
        if: always()
        run: ./build/atomsim --target Pu239 --events 20000 | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            *.txt
            csv/

  viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Build
        run: |
          cmake -S . -B build -DATOMSIM_VIZ=ON -DATOMSIM_TESTS=OFF -DATOMSIM_WERROR=ON
          cmake --build build -j --target atomsim-viz
      - name: Screenshots
        run: |
          mkdir -p shots && cd shots
          run() { xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ../build/atomsim-viz --screenshot "$@"; }
          run 1 atom.png 120
          run 2 fission-split.png 330
          run 2 fission-after.png 560
          run 3 chain.png 240
          run 3 chain-late.png 420
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Build WebAssembly
        run: |
          emcmake cmake -S . -B web -DATOMSIM_VIZ=ON -DATOMSIM_TESTS=OFF -DPLATFORM=Web \
            -DATOMSIM_DATA_DIR=/data -DCMAKE_BUILD_TYPE=Release
          cmake --build web -j --target atomsim-viz
          mkdir -p site && cp web/index.* site/ && ls -la site
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: site/
